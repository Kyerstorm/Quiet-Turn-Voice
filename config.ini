; Quiet Turn Voice settings. Restart the game after editing this file.

[Keybind]
; Key that cycles the voice modes. Use a key name from the UE4SS Key Code Reference:
; https://docs.ue4ss.com/lua-api/table-definitions/key.html
; Examples: F7, F8, F10, INS, HOME, PAGE_UP, NUM_FIVE, A, ONE
; An unknown name falls back to F7 (UE4SS.log says so).
Key = F7

; Optional modifier keys that must be held, separated by commas: CTRL, SHIFT, ALT
; Example: Modifiers = CTRL, SHIFT
Modifiers =
